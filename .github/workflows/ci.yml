name: CI — Lint, Test & Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "terraform/**"
      - ".github/workflows/ci.yml"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend — lint + pytest
  # ────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --quiet ruff
          pip install --quiet -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check backend/ --output-format=github

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --tb=short
        env:
          MONGO_URI: mongodb://localhost:27017/test
          PUBLIC_BASE_URL: http://localhost
          DEPLOYMENT_MODE: k8s

      - name: Check imports resolve
        run: python -c "import sys; sys.path.insert(0, 'backend'); import main"
        env:
          MONGO_URI: mongodb://localhost:27017/test
          PUBLIC_BASE_URL: http://localhost
          DEPLOYMENT_MODE: k8s

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend — install + build
  # ────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ────────────────────────────────────────────────────────────────────────────
  # Docker — build + Trivy SARIF scan → GitHub Security tab
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build & Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload SARIF

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: deployhub-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=deployhub-backend

      - name: Scan backend with Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: deployhub-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"   # warn only on PRs; deploy.yml blocks on main

      - name: Upload backend SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: deployhub-frontend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=deployhub-frontend

      - name: Scan frontend with Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: deployhub-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload frontend SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # ────────────────────────────────────────────────────────────────────────────
  # Terraform — format + validate
  # ────────────────────────────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform — Format & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init (local only)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform
