apiVersion: v1
kind: ServiceAccount
metadata:
  name: builder-sa
  namespace: deployhub
  annotations:
    eks.amazonaws.com/role-arn: "${BACKEND_SA_ROLE_ARN}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: builder-pod-manager
  namespace: deployhub
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: builder-rolebinding
  namespace: deployhub
subjects:
  - kind: ServiceAccount
    name: builder-sa
    namespace: deployhub
roleRef:
  kind: Role
  name: builder-pod-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: builder
  namespace: deployhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployhub-builder
  template:
    metadata:
      labels:
        app: deployhub-builder
    spec:
      serviceAccountName: builder-sa
      imagePullSecrets:
        - name: ecr-private-key
      initContainers:
        - name: wait-for-mongo-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb 27017 && nc -z redis 6379; do echo "Waiting for MongoDB and Redis..."; sleep 5; done']
      containers:
        - name: builder
          image: deployhub-backend:latest
          command: ["python", "builder.py"]
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DEPLOYMENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: deployment-mode
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: mongo-uri
            - name: MONGO_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: mongo-db-name
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: BUILDKIT_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: buildkit-host
            - name: REGISTRY_ADDR
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: registry-addr
            - name: REGISTRY_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: registry-insecure
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: public-base-url
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: aws-region
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: backend-data
              mountPath: /data
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: backend-data
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
