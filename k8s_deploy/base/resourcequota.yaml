apiVersion: v1
kind: ResourceQuota
metadata:
  name: deployhub-apps-quota
  namespace: deployhub-apps
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 512Mi
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: deployhub-apps-limits
  namespace: deployhub-apps
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager
  namespace: deployhub-apps
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-pod-manager
  namespace: deployhub-apps
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: deployhub
roleRef:
  kind: Role
  name: pod-manager
  apiGroup: rbac.authorization.k8s.io
