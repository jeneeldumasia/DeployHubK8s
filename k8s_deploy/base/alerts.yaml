apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: deployhub-alerts
  namespace: deployhub
  labels:
    prometheus: deployhub
spec:
  groups:
    - name: deployhub.rules
      rules:
        - alert: HighMemoryUsage
          expr: container_memory_usage_bytes{namespace="deployhub"} > 1.5 * 1024 * 1024 * 1024
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage detected"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using over 1.5GB of memory."
        - alert: PodRestartLoop
          expr: rate(kube_pod_container_status_restarts_total{namespace="deployhub"}[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod is restarting frequently"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in a restart loop."
