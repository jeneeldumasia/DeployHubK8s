
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: deployhub
  annotations:
    # EKS: IRSA — pod assumes this IAM role for ECR push without static credentials
    # k3s: annotation is ignored, ECR access uses node IAM role or ecr-private-key secret
    eks.amazonaws.com/role-arn: "${BACKEND_SA_ROLE_ARN}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager
  namespace: deployhub
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-pod-manager
  namespace: deployhub
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: deployhub
roleRef:
  kind: Role
  name: pod-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: deployhub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: deployhub-backend
  template:
    metadata:
      labels:
        app: deployhub-backend
    spec:
      serviceAccountName: backend-sa
      imagePullSecrets:
        - name: ecr-private-key
      initContainers:
        - name: wait-for-mongo-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb 27017 && nc -z redis 6379; do echo "Waiting for MongoDB and Redis..."; sleep 5; done']
      containers:
        - name: backend
          image: deployhub-backend:latest
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          env:
            - name: DEPLOYMENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: deployment-mode
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: mongo-uri
            - name: MONGO_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: mongo-db-name
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: BUILDKIT_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: buildkit-host
            - name: REGISTRY_ADDR
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: registry-addr
            - name: REGISTRY_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: registry-insecure
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: public-base-url
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: aws-region
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: github-webhook-secret
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: backend-data
              mountPath: /data
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: backend-data
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: deployhub
  annotations:
    # On k3s: NodePort is used directly
    # On EKS: ALB controller uses ClusterIP + pod IPs via target-type: ip
spec:
  selector:
    app: deployhub-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
  type: NodePort   # works on both k3s and EKS (ALB controller ignores type)

---
# Pod Disruption Budget — ensures at least 1 backend pod stays up during
# node drains and cluster maintenance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: deployhub
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: deployhub-backend
